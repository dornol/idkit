name: maven-publish.yml
on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: dornol

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Write GPG key to file
        run: |
          mkdir -p ~/.gradle
          echo "${{ secrets.SIGNING_SECRET_KEY }}" | base64 --decode > ~/.gradle/secring.gpg


      - name: Set up gradle.properties
        run: |
          echo "mavenCentralUsername=${{ secrets.MAVEN_CENTRAL_USERNAME }}" >> ~/.gradle/gradle.properties
          echo "mavenCentralPassword=${{ secrets.MAVEN_CENTRAL_PASSWORD }}" >> ~/.gradle/gradle.properties
          echo "signing.password=${{ secrets.SIGNING_PASSWORD }}" >> ~/.gradle/gradle.properties
          echo "signing.keyId=${{ secrets.SIGNING_KEYID }}" >> ~/.gradle/gradle.properties
          echo "signing.secretKeyRingFile=$(echo ~/.gradle/secring.gpg)" >> ~/.gradle/gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify release tag matches project version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PROJECT_VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' build.gradle.kts)
          test "$RELEASE_TAG" = "$PROJECT_VERSION"

      - name: Verify all Maven publications
        run: ./gradlew verifyPublicationModules --no-daemon

      - name: Build & Publish
        run: ./gradlew check publish --no-daemon

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            NOTES=$(awk -v tag="$RELEASE_TAG" \
              'index($0, "## [" tag "]") == 1 { found=1 } found && /^## \[/ && index($0, "## [" tag "]") != 1 { exit } found { print }' \
              CHANGELOG.md)
            if [ -z "$NOTES" ]; then
              echo "No changelog section found for $RELEASE_TAG"
              exit 1
            fi
            gh release create "$RELEASE_TAG" --title "idkit $RELEASE_TAG" --notes "$NOTES"
          fi
