name: Benchmark smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * 1"

jobs:
  jmh-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Run short JMH smoke benchmark
        run: ./gradlew jmh --no-daemon -Pjmh.includes=GeneratorThroughputBenchmark.snowflakeNextId -Pjmh.warmup=0 -Pjmh.iterations=1 -Pjmh.fork=0
